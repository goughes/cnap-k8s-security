# The only sane starting posture.
#   podSelector: {}      -> EVERY pod in this namespace
#   policyTypes: Ingress with no rules listed -> nothing may come in
# Policies are additive allow-lists: add allow rules on top of this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: team-bravo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
