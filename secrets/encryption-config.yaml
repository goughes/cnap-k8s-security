# BONUS: encryption at rest. Read the caveat before you feel safe.
#
# 1. Generate a real key and paste it in below:
#        head -c 32 /dev/urandom | base64
# 2. Stage it:  cp secrets/encryption-config.yaml ~/.minikube/files/etc/ssl/certs/
# 3. Add to minikube start:
#        --extra-config=apiserver.encryption-provider-config=/etc/ssl/certs/encryption-config.yaml
# 4. Re-encrypt existing secrets:
#        kubectl get secrets -A -o json | kubectl replace -f -
#
# !!! THE HONEST CAVEAT !!!
# This stores the encryption key in a plaintext file on the SAME DISK as
# the data it protects. Anyone who can read the etcd file can read the key.
# Fine for teaching; in production you use a KMS provider so the key
# material lives in a cloud KMS or an HSM.
#
# !!! identity MUST STAY LAST !!!
# The first provider is used for WRITES. identity means "no encryption".
# Put identity first and you have silently disabled encryption while the
# config still looks enabled.
apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources:
      - secrets
    providers:
      - aescbc:
          keys:
            - name: key1
              secret: REPLACE_ME_WITH_32_RANDOM_BYTES_BASE64
      - identity: {}
